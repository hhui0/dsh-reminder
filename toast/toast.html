<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>提醒</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
        /* 窗口高度就是「内容高度」——页面量出多少，主进程就把窗口设成多少。
           所以这里永远不该出现滚动条：多一条滚动条会把卡片挤窄约 15px，右侧还多一道
           灰边，看起来像窗口漏了一块。 */
        overflow: hidden;
        scrollbar-width: none;
      }
      body::-webkit-scrollbar,
      #reminder-toast-list::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      #reminder-toast-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        overflow: hidden;
      }
      .rt-item {
        width: 340px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: #151e2e;
        color: #e6edf7;
        padding: 12px 14px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        animation: rt-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      @keyframes rt-in {
        from {
          opacity: 0;
          transform: translateX(24px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      body.light .rt-item {
        border: 1px solid rgba(15, 23, 42, 0.1);
        background: #ffffff;
        color: #0f172a;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.1);
      }
      .rt-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #8fa1b8;
        margin-bottom: 6px;
      }
      body.light .rt-head {
        color: #64748b;
      }
      .rt-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2dd4bf;
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18);
      }
      .rt-rule {
        margin-left: auto;
      }
      .rt-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 8px;
        word-break: break-all;
      }
      .rt-label-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rt-note {
        font-size: 11px;
        line-height: 16px;
        color: #8fa1b8;
        margin: -4px 0 8px;
        word-break: break-word;
      }
      body.light .rt-note {
        color: #64748b;
      }
      .rt-count {
        flex-shrink: 0;
        border-radius: 999px;
        padding: 1px 7px;
        background: rgba(45, 212, 191, 0.16);
        color: #5eead4;
        font-size: 10px;
        font-weight: 700;
      }
      body.light .rt-count {
        background: rgba(13, 148, 136, 0.14);
        color: #0f766e;
      }
      .rt-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .rt-meta {
        font-size: 11px;
        color: #64748b;
      }
      body.light .rt-meta {
        color: #94a3b8;
      }
      .rt-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .rt-ack {
        border: 0;
        border-radius: 8px;
        padding: 6px 16px;
        background: #2dd4bf;
        color: #06251f;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .rt-ack:hover {
        background: #5eead4;
      }
      .rt-ghost {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 5px 10px;
        background: transparent;
        color: #8fa1b8;
        font-size: 11px;
        cursor: pointer;
      }
      .rt-ghost:hover {
        color: #e6edf7;
        border-color: rgba(255, 255, 255, 0.3);
      }
      body.light .rt-ghost {
        border-color: rgba(15, 23, 42, 0.16);
        color: #64748b;
      }
      body.light .rt-ghost:hover {
        color: #0f172a;
        border-color: rgba(15, 23, 42, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="reminder-toast-list"></div>
    <script src="toast.js"></script>
  </body>
</html>
